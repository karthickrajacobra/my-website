<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karthick Raja</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  transition:0.5s;
  background:#0f2027;
  color:white;
}

/* DARK MODE */
.dark{
  background:#0f2027;
  color:white;
}

.light{
  background:#f5f5f5;
  color:black;
}

/* Navbar */
nav{
  display:flex;
  justify-content:space-between;
  padding:15px 20px;
  background:rgba(0,0,0,0.4);
  position:sticky;
  top:0;
}

.menu{
  display:none;
  cursor:pointer;
}

/* Mobile */
@media(max-width:768px){
  .links{
    display:none;
    flex-direction:column;
  }
  .links.show{
    display:flex;
  }
  .menu{
    display:block;
  }
}

/* Hero */
.hero{
  text-align:center;
  padding:60px 20px;
}

.profile{
  width:130px;
  height:130px;
  border-radius:50%;
  border:4px solid white;
  object-fit:cover;
  animation: float 3s infinite;
}

@keyframes float{
  50%{transform:translateY(-10px);}
}

/* Button */
.btn{
  display:inline-block;
  margin:10px;
  padding:10px 20px;
  border-radius:25px;
  background:#ff4d6d;
  color:white;
  text-decoration:none;
}

/* Sections */
.section{
  padding:50px 20px;
  text-align:center;
}

.container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
}

.card{
  padding:20px;
  border-radius:10px;
  background:rgba(255,255,255,0.1);
  opacity:0;
  transform:translateY(30px);
  transition:0.5s;
}

.card.show{
  opacity:1;
  transform:translateY(0);
}

footer{
  text-align:center;
  padding:20px;
}
</style>
</head>

<body class="dark">

<!-- NAV -->
<nav>
  <h2>Karthick Raja A</h2>

  <div class="menu" onclick="toggleMenu()">☰</div>

  <div class="links" id="navLinks">
    <a href="#about">About</a>
    <a href="#skills">Skills</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</a>
    <button onclick="toggleTheme()">🌙</button>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <img src="profile.jpg" class="profile">
  <h1>Karthick Raja</h1>
  <h3 id="typing"></h3>
</section>

<!-- ABOUT -->
<section id="about" class="section">
  <h2>About Me</h2>
  <p>I build modern websites & creative content.</p>
</section>

<!-- SKILLS -->
<section id="skills" class="section">
  <h2>Skills</h2>
  <div class="container">
    <div class="card">HTML</div>
    <div class="card">CSS</div>
    <div class="card">JavaScript</div>
    <div class="card">Editing</div>
  </div>
</section>

<!-- PROJECTS -->
<section id="projects" class="section">
  <h2>Projects</h2>
  <div class="container">
    <div class="card">Portfolio</div>
    <div class="card">Gaming Videos</div>
    <div class="card">Mini Apps</div>
  </div>
</section>

<!-- CONTACT -->
<section id="contact" class="section">
  <h2>Contact</h2>
  <p>Email: karthickraja17052007@gmail.com</p>
  <a href="https://instagram.com/shadow_king2k07" class="btn" target="_blank">Instagram</a>
  <a href="https://wa.me/919486823549" class="btn" target="_blank">WhatsApp</a>
</section>

<footer>
  © 2026 Karthick Raja
</footer>

<script>
/* Typing */
let text="Web Developer | Gamer | Editor";
let i=0;
function type(){
 if(i<text.length){
  document.getElementById("typing").innerHTML+=text[i];
  i++;
  setTimeout(type,80);
 }
}
type();

/* Theme */
function toggleTheme(){
 document.body.classList.toggle("light");
}

/* Mobile Menu */
function toggleMenu(){
 document.getElementById("navLinks").classList.toggle("show");
}

/* Scroll Animation */
let cards=document.querySelectorAll(".card");
window.addEventListener("scroll",()=>{
 cards.forEach(c=>{
  let top=c.getBoundingClientRect().top;
  if(top<window.innerHeight-50){
    c.classList.add("show");
  }
 });
});
</script>

</body>
</html>
